id: ghcli
version: 0.1.0
type: application
dependencies:
  - id: am-lang-core
    realm: github
    type: git-repo
    tag: latest
    url: https://github.com/anderskjeldsen/am-lang-core.git
    features: ["floatingPoint"]
  - id: am-net
    realm: github
    type: git-repo
    tag: latest
    url: https://github.com/anderskjeldsen/am-net.git
  # HTTPS is non-negotiable for the GitHub API, and am-ssl is what
  # am-web-client's SslSocketStream is built on - so it is a direct
  # dependency here too, not just a transitive one.
  - id: am-ssl
    realm: github
    type: git-repo
    tag: latest
    branch: main
    url: https://github.com/anderskjeldsen/am-ssl.git
  - id: am-json
    realm: github
    type: git-repo
    tag: latest
    branch: main
    url: https://github.com/anderskjeldsen/am-json.git
  - id: am-web-client
    realm: github
    type: git-repo
    tag: latest
    branch: main
    url: https://github.com/anderskjeldsen/am-web-client.git

platforms:
  - id: libc
    abstract: true
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -noixemul
  - id: linux-x64
    extends: libc
    gccCommand: gcc
    # OpenSSL (ssl/crypto via am-ssl) linked at the app level because
    # am-ssl's linux-x64 platform doesn't declare it - same pattern as
    # am-git's package.yml.
    gccAdditionalLibraries:
      - ssl
      - crypto
  - id: macos
    extends: libc
    gccCommand: gcc -O3
  - id: macos-arm
    extends: libc
    gccCommand: gcc
  - id: morphos-ppc
    extends: libc
    # -Os for the same reason as am-git: MorphOS' loader wedges on
    # relocatable ELFs past ~9-11 MB.
    gccCommand: ppc-morphos-gcc -Os
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -s

buildTargets:
  - id: amigaos_docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc
      buildPath: /host
  - id: macos
    platform: macos
  - id: macos-arm
    platform: macos-arm
  - id: linux-x64
    platform: linux-x64
  - id: morphos-ppc_docker
    platform: morphos-ppc
    dockerBuild:
      image: amigadev/crosstools:ppc-morphos
      buildPath: /work
