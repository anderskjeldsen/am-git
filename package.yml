id: am-git
version: 0.12.3
type: application
dependencies:
  - id: am-lang-core
    realm: github
    type: git-repo
    tag: latest
#    branch: master
    url: https://github.com/anderskjeldsen/am-lang-core.git
    features: ["floatingPoint"]
  - id: am-net
    realm: github
    type: git-repo
    tag: latest
#    branch: master
    url: https://github.com/anderskjeldsen/am-net.git
  - id: am-ssl
    realm: github
    type: git-repo
    tag: latest
    branch: main
    url: https://github.com/anderskjeldsen/am-ssl.git
  - id: am-z
    realm: github
    type: git-repo
    tag: latest
    branch: main
    url: https://github.com/anderskjeldsen/am-z.git
  - id: am-crypto
    realm: github
    type: git-repo
    tag: latest
    branch: main
    url: https://github.com/anderskjeldsen/am-crypto.git
  - id: am-json
    realm: github
    type: git-repo
    tag: latest
    branch: main
    url: https://github.com/anderskjeldsen/am-json.git
  - id: am-yaml
    realm: github
    type: git-repo
    tag: latest
    branch: main
    url: https://github.com/anderskjeldsen/am-yaml.git
  - id: am-web-client
    realm: github
    type: git-repo
    tag: latest
    branch: main
    url: https://github.com/anderskjeldsen/am-web-client.git
  - id: am-tests
    testOnly: true
    realm: github
    type: git-repo
    tag: latest
    url: https://github.com/anderskjeldsen/am-tests.git

platforms:
  - id: libc
    abstract: true
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc
    # -ffunction-sections / -fdata-sections + -Wl,--gc-sections:
    # each function and global goes into its own section, then the
    # linker drops every section nothing references. Roughly halves
    # the binary by dropping unused AmLang runtime classes/methods.
    # Safe with libnix/libc — ncrt0.o's _start stays at offset 0 of
    # the first code hunk (which is what the AmigaOS hunk loader
    # executes), and vtable construction takes function addresses
    # via relocations the linker tracks as live.
    gccAdditionalOptions:
      - -noixemul
#      - -ffunction-sections
#      - -fdata-sections
    additionalLinkerFlags:
      - -noixemul
#      - -Wl,--gc-sections
  - id: linux-x64
    extends: libc
    gccCommand: gcc
    # OpenSSL (ssl/crypto via am-ssl) + zlib (via am-z) — linked at the app
    # level because those packages' linux-x64 platforms don't declare them
    # (same pattern as am-ide's package.yml).
    gccAdditionalLibraries:
      - ssl
      - crypto
      - z
  - id: linux-ppc32
    extends: libc
    gccCommand: powerpc-linux-gnu-gcc -O1
    gccAdditionalOptions:
      - -pthread
  - id: macos
    extends: libc
    gccCommand: gcc -O3
  - id: macos-arm
    extends: libc
    gccCommand: gcc
  - id: morphos-ppc
    extends: libc
    # -Os, not -O3: MorphOS' loader silently wedges on relocatable ELFs
    # bigger than ~9-11 MB (proven via pad-canary on the QEMU rig), so
    # binary size is a hard functional constraint here, not a tuning knob.
    gccCommand: ppc-morphos-gcc -Os
    # Same size-shrink mechanism as the amigaos target above —
    # function/data sections + linker gc.
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      # NOTE: do NOT add -Wl,--gc-sections here — it deletes .ctdt (the
      # libnix constructor-table section) and .data, producing a binary
      # that wedges pre-main. Needs KEEP() support before it's safe.
      - -s

buildTargets:
  - id: amigaos_docker
    platform: amigaos
    # Class-level dead-code elimination (amlc TreeShaker).
    treeShake: true
    dockerBuild:
      image: amiga-gcc
      buildPath: /host
  # Cross-compile the test binary on m68k, then run it under headless
  # Amiberry (amlang-amiberry image, ROM + CLIDrive baked in) so the
  # whole am-git test suite runs on real 68k AmigaOS:
  #   make test-amigaos   (= amlc test . -bt amigaos-amiberry)
  - id: amigaos-amiberry
    platform: amigaos
    dockerBuild:
      image: amiga-gcc
      buildPath: /host
    dockerTest:
      image: amlang-amiberry:latest
      # The suite does heavy zlib + file I/O work; emulated 68020 under
      # Amiberry JIT needs headroom over the ~1 min host run.
      timeoutSeconds: 1200
  - id: macos
    platform: macos
  - id: macos-arm
    platform: macos-arm
  - id: linux-x64
    platform: linux-x64
  - id: morphos-ppc_docker
    platform: morphos-ppc
    dockerBuild:
      image: amigadev/crosstools:ppc-morphos
      buildPath: /work